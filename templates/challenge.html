<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memeriksa keamanan koneksi Anda...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #1d1d1d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .wrapper {
            width: 100%;
            max-width: 540px;
        }
        .domain-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #111827;
        }
        .subtitle {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 22px;
        }
        .verify-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #fafafa;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            padding: 16px 20px;
            min-height: 78px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }
        .left-status {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        /* Animasi Spinner Titik Hijau */
        .dot-spinner {
            position: relative;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }
        .dot-spinner div {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #1f8b4c;
            border-radius: 50%;
            animation: dotFade 1.2s linear infinite;
        }
        .dot-spinner div:nth-child(1) { top: 2px; left: 13.5px; animation-delay: 0s; }
        .dot-spinner div:nth-child(2) { top: 5.5px; left: 21.5px; animation-delay: -0.15s; }
        .dot-spinner div:nth-child(3) { top: 13.5px; left: 25px; animation-delay: -0.3s; }
        .dot-spinner div:nth-child(4) { top: 21.5px; left: 21.5px; animation-delay: -0.45s; }
        .dot-spinner div:nth-child(5) { top: 25px; left: 13.5px; animation-delay: -0.6s; }
        .dot-spinner div:nth-child(6) { top: 21.5px; left: 5.5px; animation-delay: -0.75s; }
        .dot-spinner div:nth-child(7) { top: 13.5px; left: 2px; animation-delay: -0.9s; }
        .dot-spinner div:nth-child(8) { top: 5.5px; left: 5.5px; animation-delay: -1.05s; }

        @keyframes dotFade {
            0%, 100% { opacity: 1; transform: scale(1.1); }
            50% { opacity: 0.2; transform: scale(0.85); }
        }

        .check-icon {
            display: none;
            width: 30px;
            height: 30px;
            background: #1f8b4c;
            color: white;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .status-text {
            font-size: 15px;
            color: #222222;
            font-weight: 400;
        }
        .right-brand {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            flex-shrink: 0;
        }
        .brand-logo {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .brand-name {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #111111;
            margin-top: 2px;
        }
        .brand-links {
            font-size: 10px;
            color: #555555;
            margin-top: 3px;
        }
        .brand-links a {
            color: #555555;
            text-decoration: underline;
        }
        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="domain-title">{{ domain }}</div>
        <div class="subtitle">Memeriksa apakah koneksi situs aman sebelum melanjutkan...</div>

        <div class="verify-box">
            <div class="left-status">
                <div class="dot-spinner" id="spinner">
                    <div></div><div></div><div></div><div></div>
                    <div></div><div></div><div></div><div></div>
                </div>
                <div class="check-icon" id="checkIcon">&#10003;</div>
                <span class="status-text" id="statusText">Melakukan verifikasi...</span>
            </div>

            <div class="right-brand">
                <div class="brand-logo">
                    <!-- Ikon Awan Keamanan -->
                    <svg width="36" height="18" viewBox="0 0 64 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M48.5 28H15C9.5 28 5 23.5 5 18C5 12.9 8.8 8.7 13.8 8.1C16.2 3.3 21.2 0 27 0C34.5 0 40.7 5.6 41.6 12.9C42.5 12.6 43.5 12.5 44.5 12.5C50.3 12.5 55 17.2 55 23C55 25.8 52.1 28 48.5 28Z" fill="#F38020"/>
                        <path d="M51 28H42C42 22.5 46.5 18 52 18C56.4 18 60 21.6 60 26C60 27.1 59.1 28 58 28H51Z" fill="#FAAD3F"/>
                    </svg>
                    <span class="brand-name">CLOUDFLARE MINI</span>
                </div>
                <div class="brand-links">
                    <a href="#privasi" onclick="return false;">Privasi</a> &bull; <a href="#bantuan" onclick="return false;">Bantuan</a>
                </div>
            </div>
        </div>

        <div class="footer-note">
            Performa &amp; keamanan dilindungi oleh Cloudflare Mini WAF Enterprise
        </div>
    </div>

    <script>
        async function runVerification() {
            const statusText = document.getElementById("statusText");
            const spinner = document.getElementById("spinner");
            const checkIcon = document.getElementById("checkIcon");

            // Blokir browser otomasi sederhana (headless webdriver)
            if (navigator.webdriver) {
                statusText.textContent = "Verifikasi gagal (Bot terdeteksi).";
                return;
            }

            // Simulasi pemeriksaan browser selama 1.5 detik
            await new Promise(resolve => setTimeout(resolve, 1500));

            const numA = parseInt("{{ num_a }}", 10);
            const numB = parseInt("{{ num_b }}", 10);
            const answer = numA + numB;

            try {
                const response = await fetch("/__waf_verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        ts: "{{ ts }}",
                        a: numA,
                        b: numB,
                        ans: answer,
                        sig: "{{ sig }}"
                    })
                });

                if (response.ok) {
                    spinner.style.display = "none";
                    checkIcon.style.display = "flex";
                    statusText.textContent = "Verifikasi berhasil!";
                    setTimeout(() => {
                        window.location.reload();
                    }, 500);
                } else {
                    statusText.textContent = "Verifikasi gagal. Silakan muat ulang.";
                }
            } catch (err) {
                statusText.textContent = "Terjadi gangguan koneksi.";
            }
        }

        window.addEventListener("DOMContentLoaded", runVerification);
    </script>
</body>
</html>
