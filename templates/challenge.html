<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WardenWAF — Memeriksa keamanan koneksi Anda...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #1d1d1d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .wrapper {
            width: 100%;
            max-width: 540px;
        }
        .domain-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #0f172a;
        }
        .subtitle {
            font-size: 14px;
            color: #475569;
            margin-bottom: 22px;
        }
        .verify-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 16px 20px;
            min-height: 78px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        }
        .left-status {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .dot-spinner {
            position: relative;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }
        .dot-spinner div {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #059669;
            border-radius: 50%;
            animation: dotFade 1.2s linear infinite;
        }
        .dot-spinner div:nth-child(1) { top: 2px; left: 13.5px; animation-delay: 0s; }
        .dot-spinner div:nth-child(2) { top: 5.5px; left: 21.5px; animation-delay: -0.15s; }
        .dot-spinner div:nth-child(3) { top: 13.5px; left: 25px; animation-delay: -0.3s; }
        .dot-spinner div:nth-child(4) { top: 21.5px; left: 21.5px; animation-delay: -0.45s; }
        .dot-spinner div:nth-child(5) { top: 25px; left: 13.5px; animation-delay: -0.6s; }
        .dot-spinner div:nth-child(6) { top: 21.5px; left: 5.5px; animation-delay: -0.75s; }
        .dot-spinner div:nth-child(7) { top: 13.5px; left: 2px; animation-delay: -0.9s; }
        .dot-spinner div:nth-child(8) { top: 5.5px; left: 5.5px; animation-delay: -1.05s; }

        @keyframes dotFade {
            0%, 100% { opacity: 1; transform: scale(1.1); }
            50% { opacity: 0.2; transform: scale(0.85); }
        }

        .check-icon {
            display: none;
            width: 30px;
            height: 30px;
            background: #059669;
            color: white;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .status-text {
            font-size: 15px;
            color: #1e293b;
            font-weight: 500;
        }
        .right-brand {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            flex-shrink: 0;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .brand-name {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #0f172a;
        }
        .brand-links {
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
        }
        .brand-links a {
            color: #64748b;
            text-decoration: underline;
        }
        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="domain-title">{{ domain }}</div>
        <div class="subtitle">Memeriksa apakah koneksi situs aman sebelum melanjutkan...</div>

        <div class="verify-box">
            <div class="left-status">
                <div class="dot-spinner" id="spinner">
                    <div></div><div></div><div></div><div></div>
                    <div></div><div></div><div></div><div></div>
                </div>
                <div class="check-icon" id="checkIcon">&#10003;</div>
                <span class="status-text" id="statusText">Melakukan verifikasi...</span>
            </div>

            <div class="right-brand">
                <div class="brand-logo">
                    <!-- Ikon Perisai Penjaga WardenWAF -->
                    <svg width="20" height="22" viewBox="0 0 24 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1L2 5.5V12.5C2 18.8 6.3 24.6 12 26C17.7 24.6 22 18.8 22 12.5V5.5L12 1Z" fill="#0F172A"/>
                        <path d="M12 4.2L5 7.3V12.5C5 17.1 8 21.3 12 22.6C16 21.3 19 17.1 19 12.5V7.3L12 4.2Z" fill="#059669"/>
                        <path d="M10.5 15.8L7.8 13.1L9.1 11.8L10.5 13.2L14.9 8.8L16.2 10.1L10.5 15.8Z" fill="#FFFFFF"/>
                    </svg>
                    <span class="brand-name">WARDENWAF</span>
                </div>
                <div class="brand-links">
                    <a href="#privasi" onclick="return false;">Privasi</a> &bull; <a href="#bantuan" onclick="return false;">Bantuan</a>
                </div>
            </div>
        </div>

        <div class="footer-note">
            Performa &amp; keamanan dilindungi oleh WardenWAF Enterprise Security
        </div>
    </div>

    <script>
        async function runVerification() {
            const statusText = document.getElementById("statusText");
            const spinner = document.getElementById("spinner");
            const checkIcon = document.getElementById("checkIcon");

            if (navigator.webdriver) {
                statusText.textContent = "Verifikasi gagal (Bot terdeteksi).";
                return;
            }

            await new Promise(resolve => setTimeout(resolve, 1500));

            const numA = parseInt("{{ num_a }}", 10);
            const numB = parseInt("{{ num_b }}", 10);
            const answer = numA + numB;

            try {
                const response = await fetch("/__waf_verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        ts: "{{ ts }}",
                        a: numA,
                        b: numB,
                        ans: answer,
                        sig: "{{ sig }}"
                    })
                });

                if (response.ok) {
                    spinner.style.display = "none";
                    checkIcon.style.display = "flex";
                    statusText.textContent = "Verifikasi berhasil!";
                    setTimeout(() => {
                        window.location.reload();
                    }, 500);
                } else {
                    statusText.textContent = "Verifikasi gagal. Silakan muat ulang.";
                }
            } catch (err) {
                statusText.textContent = "Terjadi gangguan koneksi.";
            }
        }

        window.addEventListener("DOMContentLoaded", runVerification);
    </script>
</body>
</html>
